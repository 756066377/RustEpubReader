name: Build & Release

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BINARY_NAME: rust_epub_reader

jobs:
  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute Cargo.lock hash
        id: cargo-lock-hash
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f Cargo.lock ]; then
            echo "hash=missing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HASH=$(python3 -c "import hashlib, pathlib; print(hashlib.sha256(pathlib.Path('Cargo.lock').read_bytes()).hexdigest())")
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ steps.cargo-lock-hash.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release -p rust_epub_reader

      - name: Bundle artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          SAFE_REF_NAME="${GITHUB_REF_NAME//\//-}"
          cp target/release/$BINARY_NAME.exe "dist/RustEpubReader-Win64-${SAFE_REF_NAME}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-build
          path: dist

  publish-release:
    name: Publish Release
    needs:
      - build-windows
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-desktop-build
          path: release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: RustEpubReader ${{ github.ref_name }}
          body: |
            ## v1.0.10

            Windows 64 位隐蔽阅读发行版。

            ### 修复
            - `F2` 只显示选项栏，不再连带打开目录。
            - 目录、设置等改由选项栏按钮手动开启。
            - 再次按 `F2` 会收起选项栏，并同时关闭目录、设置、搜索、批注、统计、朗读、分享等窗口。

            ### 说明
            - 基于 v1.0.9（已同步上游 v1.0.8）。
            - CI 发行版构建仍只生成 Windows 桌面端产物。

            ### 下载
            - `RustEpubReader-Win64-v1.0.10.exe`
          files: |
            release-artifacts/RustEpubReader-Win64-*.exe
