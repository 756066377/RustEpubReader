name: Build & Release

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
    paths:
      - "core/**"
      - "desktop/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BINARY_NAME: rust_epub_reader

jobs:
  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute Cargo.lock hash
        id: cargo-lock-hash
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f Cargo.lock ]; then
            echo "hash=missing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HASH=$(python3 -c "import hashlib, pathlib; print(hashlib.sha256(pathlib.Path('Cargo.lock').read_bytes()).hexdigest())")
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ steps.cargo-lock-hash.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release -p rust_epub_reader

      - name: Bundle artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          SAFE_REF_NAME="${GITHUB_REF_NAME//\//-}"
          cp target/release/$BINARY_NAME.exe "dist/RustEpubReader-Win64-${SAFE_REF_NAME}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-build
          path: dist

  publish-release:
    name: Publish Release
    needs:
      - build-windows
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-desktop-build
          path: release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: RustEpubReader ${{ github.ref_name }}
          body: |
            ## v1.0.4

            ### 新增
            - Windows 桌面端段评面板入口与段评浏览能力。
            - 动态中文纠错（CSC）插件加载支持。
            - 阅读器工具栏段评入口与相关国际化文案。

            ### 改进
            - 同步上游 `zhongbai2333/RustEpubReader:main` 最新更新。
            - 优化书库卡片布局、标题截断和阅读器部分交互细节。
            - 优化分享/配对相关逻辑，降低敏感信息日志暴露风险。
            - CI 发行版构建精简为仅生成 Windows 桌面端产物。

            ### 修复
            - 修复阅读器快捷键在输入框聚焦或面板打开时可能误触发的问题。
            - 修复合并上游后 `Cargo.lock`、国际化文件和桌面端入口的冲突。
          files: |
            release-artifacts/RustEpubReader-Win64-*.exe
